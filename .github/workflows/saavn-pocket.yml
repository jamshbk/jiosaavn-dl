name: Build Saavn Pocket APK
on:
  push:
    branches: [codex/saavn-pocket-android]
    paths: ['android/**', '.github/workflows/saavn-pocket.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Keep debug signing identity for subsequent builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: saavn-pocket-webview-debug-signing-v1
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
          python -m pip install 'buildozer==1.5.0' 'Cython==0.29.36' setuptools requests mutagen playwright
      - name: Check backend
        run: python -m unittest discover -s tests -v
      - name: Check responsive screens and app flow
        run: |
          python -m playwright install --with-deps chromium
          python tests/ui_check.py
      - name: Save screen previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saavn-pocket-v0.2.1-ui-previews
          path: android/ui-previews/*.png
          if-no-files-found: ignore
      - name: Build debug APK
        run: buildozer -v android debug
      - name: Verify and name APK
        run: |
          python - <<'PY'
          import zipfile, shutil
          from pathlib import Path
          files = list(Path('bin').glob('*.apk'))
          assert len(files) == 1, 'Expected one APK'
          with zipfile.ZipFile(files[0]) as z:
              assert z.testzip() is None
              assert 'AndroidManifest.xml' in z.namelist()
              assert 'classes.dex' in z.namelist()
          shutil.copyfile(files[0], 'Saavn-Pocket-v0.2.1-debug.apk')
          PY
          sha256sum Saavn-Pocket-v0.2.1-debug.apk > SHA256SUMS.txt
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check native Android storage on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python android/tests/emulator_check.py
      - name: Save native test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saavn-pocket-v0.2.1-native-check
          path: android/native-check.log
          if-no-files-found: ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saavn-pocket-v0.2.1-apk
          path: |
            android/Saavn-Pocket-v0.2.1-debug.apk
            android/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if gh release view saavn-pocket-v0.2.1 >/dev/null 2>&1; then
            gh release upload saavn-pocket-v0.2.1 Saavn-Pocket-v0.2.1-debug.apk SHA256SUMS.txt --clobber
          else
            gh release create saavn-pocket-v0.2.1 Saavn-Pocket-v0.2.1-debug.apk SHA256SUMS.txt --target "$SOURCE_SHA" --prerelease --title 'Saavn Pocket v0.2.1 (debug)' --notes 'Fixes Android ClassNotFoundException during download export and clipboard access by loading app Java references on the Python entry thread. Worker-thread MediaStore export and byte-for-byte readback are checked on an Android emulator before publishing. Android 10+, ARM64 and x86_64. Physical-phone and live-service testing remains separate.'
          fi
