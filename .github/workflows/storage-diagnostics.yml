name: Inspect Android build failure
on:
  push:
    branches: [codex/saavn-pocket-android]
    paths: ['.github/workflows/storage-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Collect compiler error
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/jamshbk/jiosaavn-dl/actions/jobs/132776004529/logs > full-build.log
          tail -n 350 full-build.log > failure-tail.log
      - uses: actions/upload-artifact@v4
        with:
          name: storage-build-diagnostics
          path: failure-tail.log
