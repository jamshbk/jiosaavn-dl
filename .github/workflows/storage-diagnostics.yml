name: Inspect Android build failure
on:
  push:
    branches: [codex/saavn-pocket-android]
    paths: ['.github/workflows/storage-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Classify failure without exporting log contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/jamshbk/jiosaavn-dl/actions/jobs/132776004529/logs --allow-escape-sequences > "$RUNNER_TEMP/compiler.log"
          python - <<'PY'
          from pathlib import Path
          import os, json
          text=Path(os.environ['RUNNER_TEMP'],'compiler.log').read_text(errors='replace')
          tail=text[-100000:].lower()
          patterns={
            'DISK_FULL':'no space left on device',
            'OUT_OF_MEMORY':'killed signal terminated program',
            'CROSS_BINARY_EXECUTION':'cannot execute binary file',
            'MISSING_FILE':'no such file or directory',
            'CYTHON_ERROR':'cython.compiler.errors.compileerror',
            'UNDEFINED_SYMBOL':'undefined reference',
            'CONFIGURE_ERROR':'configure: error:',
            'PYTHON_EXCEPTION':'traceback (most recent call last)',
            'PIP_INSTALL_ERROR':'could not build wheels',
            'COMPILER_ERROR':'fatal error:',
            'PATCH_ERROR':'hunk #1 failed',
            'GRADLE_FAILED':'failure: build failed',
            'NO_APK':'no apks',
            'NETWORK_ERROR':'temporary failure in name resolution',
            'NO_BOOTSTRAP':'no usable bootstrap',
            'PYTHON_BUILD_FATAL':'fatal python error',
          }
          print(json.dumps({key:value in tail for key,value in patterns.items()}))
          recipes=['python3','pyjnius','openssl','libffi','genericndkbuild']
          print(json.dumps({'last_recipe_category':max(recipes,key=lambda key:tail.rfind('building '+key)) if any('building '+key in tail for key in recipes) else 'unknown'}))
          import re
          allowed=['TypeError','ValueError','RuntimeError','AssertionError','AttributeError','ImportError','ModuleNotFoundError','KeyError','IndexError','FileNotFoundError','FileExistsError','PermissionError','OSError','ErrorReturnCode_1','ErrorReturnCode_2','BuildInterruptingException','CalledProcessError']
          print(json.dumps({'exception_categories':[key for key in allowed if key.lower()+':' in tail]}))
          public_modules={'bootstrap.py','toolchain.py','recipe.py','build.py','__init__.py','android.py','sh.py','util.py','pythonforandroid.py','logger.py','archs.py'}
          frames=re.findall(r'File "([^"]+)", line (\d+)',text[-100000:])
          print(json.dumps({'public_frame_lines':[{'module':Path(p).name,'line':int(n)} for p,n in frames if Path(p).name in public_modules][-12:]}))
          print(json.dumps({'pip_categories':{key:pattern in tail for key,pattern in {
          'NO_MATCHING_DISTRIBUTION':'no matching distribution found',
          'NO_REQUIREMENT_VERSION':'could not find a version that satisfies',
          'PACKAGE_METADATA_ERROR':'metadata-generation-failed',
          'SETUPPY_ERROR':'subprocess-exited-with-error',
          'PYJNIUS_BUILD_ERROR':'failed building wheel for pyjnius',
          'MISSING_PIP':'no module named pip',
          'PEP668':'externally-managed-environment',
          'PIPSSL':'certificate verify failed',
          'NDK_ERROR':'unknown target cpu',
          'HOSTPYTHON_MISSING':'hostpython',
          'NO_COLLECTION':'could not find'}.items()}}))
          vocabulary=set('error failed failure pip python ssl ctypes ffi openssl socket connect connection network timeout timed retry retries module import missing no not found supported unsupported required requires version distribution wheel build environment managed externally venv virtual system package permission denied executable libpython ELF wrong class architecture arm64 x86_64 platform attribute argument unexpected unrecognized command install upgrade uninstall broken pipe closed reset certificate verify verification proxy host port unreachable requests urllib3 certifi truststore memory space device disk errno'.lower().split())
          region=text[text.rfind('STDOUT:'):][-20000:] if 'STDOUT:' in text else text[-20000:]
          words=re.findall(r'[A-Za-z_][A-Za-z_0-9]*',region.lower())
          print(json.dumps({'allowlisted_error_words':sorted(set(words)&vocabulary)}))
          print(json.dumps({'allowlisted_error_line_words':[sorted(set(re.findall(r'[A-Za-z_][A-Za-z_0-9]*',line.lower()))&vocabulary) for line in region.splitlines() if any(word in line.lower() for word in ['error','exception','failed','cannot','could not','no module'])][-12:]}))
          PY
          rm -f "$RUNNER_TEMP/compiler.log"
